name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.8.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:reference          # generated SQL must match TS rules/campaign/exercises
      - run: pnpm --filter @agogeraining/mobile export:check   # app bundles for iOS + Android
      - run: pnpm build:web                                     # Next.js production build of the web app
      - name: Database migrations + integration tests
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
          export PGBIN="$(ls -d /usr/lib/postgresql/*/bin | tail -1)"
          pnpm db:test
